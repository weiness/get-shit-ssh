name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: gss.exe
            output: gss-windows-amd64.exe

          - os: macos-latest
            platform: darwin/universal
            artifact: gss.app
            output: gss-macos-universal.app.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: wails build -platform ${{ matrix.platform }} -o ${{ matrix.artifact }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform ${{ matrix.platform }}
          cd build/bin && zip -r ${{ matrix.output }} gss.app

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/bin/${{ matrix.artifact }}

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/bin/${{ matrix.output }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GSS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/gss-windows-amd64.exe/gss.exe
            dist/gss-macos-universal.app.zip/gss-macos-universal.app.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
