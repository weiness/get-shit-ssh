name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            output: gss-windows-amd64.exe

          - os: windows-latest
            platform: windows/arm64
            output: gss-windows-arm64.exe

          - os: macos-latest
            platform: darwin/amd64
            output: gss-macos-intel.app.zip

          - os: macos-latest
            platform: darwin/arm64
            output: gss-macos-apple-silicon.app.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          wails build -platform ${{ matrix.platform }} -o ${{ matrix.output }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform ${{ matrix.platform }}
          cd build/bin && zip -r ${{ matrix.output }} gss.app && rm -rf gss.app

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/bin/${{ matrix.output }}

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/bin/${{ matrix.output }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Extract changelog for this version
        run: |
          VERSION="${{ github.ref_name }}"
          awk "/^## ${VERSION}/,/^## v[0-9]+\.[0-9]+\.[0-9]+/" CHANGELOG.md \
            | head -n -1 \
            > release-notes.md
          # Fallback: if empty, just use the version line
          if [ ! -s release-notes.md ]; then
            echo "## ${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GSS ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/gss-windows-amd64.exe/gss-windows-amd64.exe
            dist/gss-windows-arm64.exe/gss-windows-arm64.exe
            dist/gss-macos-intel.app.zip/gss-macos-intel.app.zip
            dist/gss-macos-apple-silicon.app.zip/gss-macos-apple-silicon.app.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
